
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO do list</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css"
        integrity="sha512-GmZYQ9SKTnOea030Tbiat0Y+jhnYLIpsGAe6QTnToi8hI2nNbVMETHeK4wm4MuYMQdrc38x+sX77+kVD01eNsQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <section class="top">
        <div class="dacha">
            <div class="naveee">
                <div class="logo">
                    <div>
                        <img src="images/logo.png" alt="">
                    </div>
                    <div>
                        <a href="">Taskmaker</a>
                    </div>
                </div>
                <div class="search">
                    <input type="text" placeholder="search tasks and tags">
                </div>
                <div class="profiles">
                    <i class="fa-solid fa-bolt"></i>
                    <i class="fa-regular fa-sun"></i>
                    <i class="fa-solid fa-bell"></i>
                </div>
            </div>
        </div>
    </section>
    <section class="side-bar">
        <div class="dacha">
            <nav class="navv">
                <ul class="lists">
                    <li>
                        <a href=""><i class="fa-solid fa-check"></i> all tasks</a>
                    </li>
                    <li>
                        <a href=""><i class="fa-solid fa-chess-board"></i> board view</a>
                    </li>
                    <li>
                        <a href=""><i class="fa-solid fa-calendar-days"></i> calender</a>
                    </li>
                    <li>
                        <a href=""><i class="fa-solid fa-folder-open"></i> project</a>
                    </li>
                    <li>
                        <a href=""><i class="fa-solid fa-arrow-up-right-dots"></i> analytics</a>
                    </li>
                    <li>
                        <a href=""><i class="fa-solid fa-gear"></i> settings</a>
                    </li>
                </ul>
            </nav>
            <div class="heroo">
                <h1>good morning yash <i class="fa-solid fa-hands-clapping"></i></h1>
                <div class="add-tasks">
                    <div>
                        <P class="task"> <input type="text" id="taskInput" placeholder="add a task"></P>
                    </div>
                    <div class="btn">
                        <button type="button" onclick="addTask()">+ add task</button>
                    </div>
                </div>
                <div class="task-list">
                    <h2>tasks</h2>
                    <ul id="taskList">
                    </ul>
                </div>
            </div>
        </div>
    </section>
<script src="js/script.js"></script>

</body>

</html>
